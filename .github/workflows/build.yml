name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pasmo
        run: |
          sudo apt-get update
          sudo apt-get install -y pasmo
      - name: Build and verify
        run: make verify
      - name: Upload COM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fdc3712-build
          path: |
            build/3712TEST.COM
            build/3712test.sym
            build/3712BOOT.COM
            build/3712boot.sym
